# C8 - tuning BLOCK x k                         backend: cuda_warp_tiled
#
# WARP_COL_TILE resta fissato a 8 per isolare l'effetto di BLOCK. Dopo avere
# scelto un BLOCK provvisorio si potra' fare lo sweep del tile e, se il tile
# vincitore cambia, una verifica locale dei BLOCK vicini.
name=c8_block_k_tuning_cuda_warp_tiled
experiment=block-sweep
outdir=results/c8_block_k_tuning

kernel=cuda_warp_tiled
x_layout=row
warp_col_tile=8

M=16384
N=16384
ks=3 6 8 20 32
blocks=64 128 192 256 384 512 1024

prec=double
reps=20
warmup=5
seed=20252026

np=1
pr=1
pc=1

a_mode=local
x_mode=local
check=0
group_timing=0

continue_on_error=1

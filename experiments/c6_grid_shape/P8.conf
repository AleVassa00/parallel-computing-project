# C6 - sweep sulla forma della griglia          P = 8
#
# all_grids=8 esegue tutte le fattorizzazioni ordinate: 1x8, 2x4, 4x2, 8x1.
#
# Cosa si sta misurando. Il volume che ogni processo comunica dipende dalla
# forma in due modi OPPOSTI:
#
#   Bcast di X lungo col_comm   ~  n_loc*k = (N/pc)*k   su pr-1 destinatari
#   Reduce di Y lungo row_comm  ~  m_loc*k = (M/pr)*k   su pc contributi
#
# Con pr=1 (griglia 1 x P) non c'e' nessun broadcast ma la reduce coinvolge
# tutti i P processi; con pc=1 (P x 1) e' il contrario. L'ottimo sta in mezzo
# e dipende da k e dal rapporto M:N - ed e' precisamente il motivo per cui la
# griglia e' 2D. Le colonne t_bcast_mean_s e t_reduce_mean_s vanno lette in
# coppia: devono muoversi in direzioni opposte lungo la sequenza di forme.
#
# Il caso P=8 include anche le forme degeneri 1x8 e 8x1, che sono le
# due decomposizioni monodimensionali: il confronto con la forma quadrata e'
# quindi diretto e sullo stesso grafico.
name=c6_grid_P8
experiment=grid-sweep
outdir=results/c6_grid_shape

kernel=scheme_a
M=20000
N=20000
ks=3 32

all_grids=8

reps=20
warmup=5
seed=20252026

bind_to=core
map_by=core

a_mode=local
x_mode=local
prec=double

continue_on_error=1

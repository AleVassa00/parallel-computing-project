# C7.2 - risorse compilate: cuda_warp_smem, double.
# registers compila tutte le istanze template in una sola build: ks NON filtra ptxas.
# Analizzare K=3,8,20,32 nel log ptxas completo, associando risorse e nome funzione.
# Il riepilogo breve non conserva il nome della funzione. Occupancy effettiva e
# shared dinamica non si ricavano da ptxas; usare anche i dati runtime di C7.1.
name=c7_2_cuda_warp_smem_double
experiment=registers
outdir=results/c7_2_precision_resources

kernel=cuda_warp_smem
prec=double
M=10000
N=10000
ks=3 8 20 32
block=256
smem_pad=1

reps=20
warmup=5
seed=20252026
np=1
pr=1
pc=1
bind_to=core
map_by=core
a_mode=local
x_mode=local
force_generic_k=0
test_a_padding=0
nvcc_arch=sm_75
continue_on_error=0

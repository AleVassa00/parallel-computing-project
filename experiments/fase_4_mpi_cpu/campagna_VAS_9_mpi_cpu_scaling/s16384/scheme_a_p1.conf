# Campagna VAS 9 - schema A di riferimento, S=16384, tutte le griglie di P=1.
name=campagna_VAS_9_s16384_scheme_a_p1_all_grids
experiment=k-sweep
outdir=results/fase_4_mpi_cpu/campagna_VAS_9_mpi_cpu_scaling/s16384

kernel=scheme_a
M=16384
N=16384
ks=3 6 8 20 32

prec=double
reps=20
warmup=5
seed=20252026

all_grids=1

bind_to=core
map_by=core

# Campagna VAS 3 - tuning colonne per warp      backend: cuda_warp_tiled
#
# Tile piccoli usano meno accumulatori per lane, ma aumentano il numero di
# warp per riga e ripetono le letture di A. Tile grandi riducono tali letture,
# ma aumentano la pressione sui registri. Lo sweep copre entrambi i regimi.
name=campagna_VAS_3_warp_tile_tuning_cuda_warp_tiled
experiment=warp-tile-sweep
outdir=results/campagna_VAS_3_warp_tile_tuning

kernel=cuda_warp_tiled
x_layout=row
warp_col_tiles=4 8 16 32

M=16384
N=16384
ks=3 6 8 20 32
block=256

prec=double
reps=20
warmup=5
seed=20252026

np=1
pr=1
pc=1

a_mode=local
x_mode=local
check=0
group_timing=0

continue_on_error=1

# Campagna VAS 4 - padding shared memory         backend: cuda_warp_smem
#
# SMEM_PAD=0 e' il termine di paragone. SMEM_PAD=1 aggiunge uno scalare a
# ciascuna riga del tile di X per ridurre i conflitti di banco, in particolare
# nel caso k=32 in FP64.
name=campagna_VAS_4_smem_pad_tuning_cuda_warp_smem
experiment=smem-pad-sweep
outdir=results/fase_1_tuning/campagna_VAS_4_smem_pad_tuning

kernel=cuda_warp_smem
smem_pads=0 1

M=16384
N=16384
ks=3 6 8 20 32
block=256

prec=double
reps=20
warmup=5
seed=20252026

np=1
pr=1
pc=1

a_mode=local
x_mode=local
check=0
group_timing=0

continue_on_error=1

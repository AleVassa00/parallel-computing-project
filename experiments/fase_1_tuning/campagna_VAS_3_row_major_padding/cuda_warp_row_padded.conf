# Campagna VAS 3 - padding device di X            backend: cuda_warp
#
# Rispetto alla Campagna 2 cambia soltanto X_PAD: il buffer GPU usa uno stride
# k+1, mentre il buffer host/MPI e il volume utile trasferito restano compatti.
# Il confronto con il column-major usa le righe BLOCK=128 della Campagna 1.
name=campagna_VAS_3_row_major_padding_cuda_warp
experiment=k-sweep
outdir=results/fase_1_tuning/campagna_VAS_3_row_major_padding

kernel=cuda_warp
x_layout=row
x_pad=1

M=16384
N=16384
ks=3 6 8 20 32
block=128

prec=double
reps=20
warmup=5
seed=20252026

np=1
pr=1
pc=1

a_mode=local
x_mode=local
check=0
group_timing=0

continue_on_error=1

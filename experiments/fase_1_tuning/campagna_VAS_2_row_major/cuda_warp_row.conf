# Campagna VAS 2 - confronto layout              backend: cuda_warp
#
# X resta nel layout row-major nativo e senza padding. BLOCK=128 e' il valore
# robusto scelto nella campagna preliminare; k continua a variare per
# verificare che il confronto con column-major non dipenda da un solo caso.
name=campagna_VAS_2_row_major_cuda_warp
experiment=k-sweep
outdir=results/fase_1_tuning/campagna_VAS_2_row_major

kernel=cuda_warp
x_layout=row
x_pad=0

M=16384
N=16384
ks=3 6 8 20 32
block=128

prec=double
reps=20
warmup=5
seed=20252026

np=1
pr=1
pc=1

a_mode=local
x_mode=local
check=0
group_timing=0

continue_on_error=1

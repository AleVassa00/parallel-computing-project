# C8 - tuning BLOCK x k                         backend: cuda_warp
#
# X e' column-major: con j distribuito fra le lane, a c fissato le lane del
# warp leggono X[c*n_loc+j] da indirizzi consecutivi.
#
# Il confronto row/column verra' eseguito dopo avere scelto un BLOCK robusto
# da questa campagna, mantenendo quel BLOCK identico nei due casi.
name=c8_block_k_tuning_cuda_warp
experiment=block-sweep
outdir=results/fase_1_tuning/campagna_VAS_block_k_tuning

kernel=cuda_warp
x_layout=column

M=16384
N=16384
ks=3 6 8 20 32
blocks=64 128 192 256 384 512 1024

prec=double
reps=20
warmup=5
seed=20252026

np=1
pr=1
pc=1

a_mode=local
x_mode=local
check=0
group_timing=0

continue_on_error=1

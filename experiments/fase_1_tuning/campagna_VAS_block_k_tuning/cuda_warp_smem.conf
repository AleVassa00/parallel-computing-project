# C8 - tuning BLOCK x k                         backend: cuda_warp_smem
#
# Il padding di shared memory resta fissato a 1 e il piano del tile resta
# automatico. Cambiando BLOCK il planner puo' scegliere x_rows_per_tile e
# blocks_per_sm diversi: entrambe le colonne sono registrate nel CSV e fanno
# parte dell'interpretazione del risultato, non sono ulteriori sweep.
name=c8_block_k_tuning_cuda_warp_smem
experiment=block-sweep
outdir=results/fase_1_tuning/campagna_VAS_block_k_tuning

kernel=cuda_warp_smem
x_layout=row
smem_pad=1

M=16384
N=16384
ks=3 6 8 20 32
blocks=64 128 192 256 384 512 1024

prec=double
reps=20
warmup=5
seed=20252026

np=1
pr=1
pc=1

a_mode=local
x_mode=local
check=0
group_timing=0

continue_on_error=1

# C3 - baseline CPU a 1 rank          generic  (FORCE_GENERIC_K=1)
#
# Due ruoli:
#
#  1. e' il DENOMINATORE di ogni speedup della relazione. La traccia chiede il
#     confronto funzionale con una implementazione seriale minimale; questo e'
#     il suo corrispettivo prestazionale, cioe' il nucleo di calcolo senza
#     nessuna comunicazione e senza GPU.
#  2. e' il microbenchmark che il README promette e che nessuna campagna
#     eseguiva: le funzioni con k noto a compile-time contro il kernel
#     generico bloccato, sullo STESSO problema.
#
# Build forzata sul fallback: bin/matmul_mpi-generic, kernel_name() = scheme_a_generic, quindi le righe restano distinguibili nel CSV.
#
# k = 40 e 64 sono un controllo: passano dal fallback in entrambe le build,
# quindi le due righe devono coincidere. Se non coincidono, la differenza
# misurata sugli altri k non e' la specializzazione ma rumore.
name=c3_cpu_generic
experiment=k-sweep
outdir=results/c3_cpu_baseline

kernel=scheme_a
force_generic_k=1

M=10000
N=10000
ks=3 6 8 20 32 40 64

reps=20
warmup=5
seed=20252026

np=1
pr=1
pc=1

a_mode=local
x_mode=local
prec=double

continue_on_error=1

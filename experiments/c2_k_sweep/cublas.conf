# C2 - sweep su k a M,N fissi          backend: cublas
#
# La traccia impone il collaudo su k = 3, 6, 8, 20, 32 e chiede che il codice
# funzioni per k generico. Qui i cinque k richiesti sono seguiti da 1, 7, 17,
# 40, 64, che NON hanno una specializzazione e attraversano quindi il
# fallback: la differenza fra le due famiglie di righe e' la misura di quanto
# vale la specializzazione, invece di darla per buona.
#
# k=40 e k=64 su scheme_a costano una rilettura di A in piu' (il blocco di
# accumulatori e' KB=32), ed e' esattamente cio' che il grafico deve mostrare.
#
# RIFERIMENTO ESTERNO, non una proposta: risponde con un numero misurato a 'perche' non avete chiamato una libreria'. Con k <= 32 un GEMM general-purpose non ammortizza il proprio percorso, e un valore basso qui giustifica l'intero progetto.
name=c2_k_sweep_cublas
experiment=k-sweep
outdir=results/c2_k_sweep

kernel=cublas
M=10000
N=10000
ks=3 6 8 20 32 1 7 17 40 64

reps=20
warmup=5
seed=20252026

np=1
pr=1
pc=1

a_mode=local
x_mode=local
prec=double

continue_on_error=1

# C7 - scaling sui thread OpenMP        omp_scheme_a, 1 rank
#
# E' la curva che risponde alla domanda "quanto rende la parallelizzazione
# interna al processo", cioe' proprio cio' che la traccia chiede in alternativa
# a CUDA. Il denominatore e' la riga con threads=1: sullo STESSO binario, non
# su un binario diverso, perche' il numero di thread e' una variabile
# d'ambiente e non di compilazione. Lo speedup a T thread e' quindi
# t(1)/t(T) misurato sullo stesso codice macchina, e non contiene la differenza
# fra due build.
#
# 1 rank e non piu': qui si misura il nucleo, non MPI. Il regime ibrido
# MPI+OpenMP e' hybrid_grid.conf.
#
# Attenzione al binding: --bind-to core legherebbe il RANK a un core solo e i
# suoi thread si contenderebbero quel core, misurando l'oversubscription al
# posto dello scaling. Per il caso a un rank la scelta corretta e' nessun
# binding di processo, con l'affinita' dei thread lasciata a OMP_PROC_BIND.
#
# k = 3 e k = 32 sono i due estremi della traccia: a k=3 l'intensita' aritmetica
# e' 3/4 FLOP/byte e il nucleo e' limitato dalla memoria, quindi lo scaling si
# appiattisce non appena i thread saturano la banda; a k=32 e' 8 FLOP/byte e
# c'e' molto piu' margine. Se le due curve si sovrapponessero, la spiegazione
# "e' la banda che satura" sarebbe da rifare.
name=c7_omp_thread_scaling
experiment=omp-thread-sweep
outdir=results/c7_openmp

kernel=omp_scheme_a
omp_threads_list=1 2 4 8 16 20
omp_proc_bind=spread
omp_places=cores

M=20000
N=20000
ks=3 32

reps=20
warmup=5
seed=20252026

np=1
pr=1
pc=1

# Nessun binding di processo: il rank deve poter usare tutti i core del nodo.
bind_to=none
map_by=

a_mode=local
x_mode=local
prec=double

continue_on_error=1

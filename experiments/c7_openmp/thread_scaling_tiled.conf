# C7 - scaling sui thread OpenMP        omp_scheme_a_tiled, 1 rank
#
# Identica a thread_scaling.conf tranne che per il backend: e' il confronto
# controllato fra "parallelizzare e basta" e "parallelizzare con il tile di X
# in cache". Le due campagne vanno eseguite di seguito e lette insieme.
#
# L'attesa e' che la differenza cresca con k e con N: il traffico in lettura su
# X vale m*n*k contro gli m*n di A, quindi e' li' che il tiling toglie lavoro
# alla gerarchia di memoria. Su k=3 il tiling potrebbe invece COSTARE, perche'
# la fetta di X e' gia' piccola e il tiling aggiunge il viavai degli
# accumulatori: e' un risultato legittimo e va riportato, non nascosto.
#
# La colonna x_rows_per_tile del CSV dice quante righe di X sono finite in un
# tile: e' la stessa colonna in cui cuda_warp_smem scrive il proprio TJ, e
# senza di essa la curva non sarebbe spiegabile.
name=c7_omp_thread_scaling_tiled
experiment=omp-thread-sweep
outdir=results/c7_openmp

kernel=omp_scheme_a_tiled
omp_threads_list=1 2 4 8 16 20
omp_proc_bind=spread
omp_places=cores

M=20000
N=20000
ks=3 32

reps=20
warmup=5
seed=20252026

np=1
pr=1
pc=1

bind_to=none
map_by=

a_mode=local
x_mode=local
prec=double

continue_on_error=1

# C7 - sweep sul budget del tile di X   OMP_X_TILE_BYTES = 65536
#
# Il backend omp_scheme_a_tiled sceglie quante righe di X mettere in un tile
# dividendo questo budget per k*sizeof(scalar_t): il numero di righe che ne
# esce finisce nel CSV come x_rows_per_tile. Il budget e' l'ipotesi sulla
# gerarchia di cache del server, ed e' esattamente cio' che questo sweep
# sostituisce con una misura.
#
# I quattro valori coprono la gerarchia: 4 KiB e 16 KiB puntano alla L1 dati,
# 64 KiB e 256 KiB alla L2 privata. Se la curva fosse piatta, il tiling non
# starebbe facendo quello che si crede e la spiegazione andrebbe rifatta.
#
# k = 32 e' il caso in cui il traffico su X pesa di piu' (vale k volte quello
# su A), quindi e' quello in cui il budget deve contare. k = 3 e' il controllo:
# li' il tiling puo' anche costare.
#
# Le quattro build coesistono come binari distinti (bin/matmul_mpi-omp_scheme_a_tiled-xtile...)
# e kernel_name() riporta il budget, quindi le righe restano distinguibili nel
# CSV senza doversi fidare dell'ordine di esecuzione.
name=c7_omp_xtile_65536
experiment=k-sweep
outdir=results/c7_openmp

kernel=omp_scheme_a_tiled
omp_x_tile_bytes=65536
omp_threads=20
omp_proc_bind=spread
omp_places=cores

M=20000
N=20000
ks=3 32

reps=20
warmup=5
seed=20252026

np=1
pr=1
pc=1

bind_to=none
map_by=

a_mode=local
x_mode=local
prec=double

continue_on_error=1

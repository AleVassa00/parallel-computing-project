# C7 - regime ibrido MPI+OpenMP         4 rank x 5 thread, griglia 2x2
#
# E' il punto della campagna in cui i due livelli di parallelismo coesistono:
# MPI distribuisce A sulla griglia bidimensionale, OpenMP parallelizza il
# nucleo dentro ogni processo. Il confronto interessante e' a PARITA' DI CORE
# OCCUPATI:
#
#   20 rank x 1 thread   -> e' c4_strong_scaling/P20.conf, kernel=scheme_a
#    4 rank x 5 thread   -> questa configurazione
#    1 rank x 20 thread  -> e' c7_omp_thread_scaling con 20 thread
#
# Le tre righe usano gli stessi venti core sullo stesso problema e differiscono
# solo per DOVE passa il confine fra i due livelli. Meno rank significa meno
# volume di Bcast/Reduce e blocchi locali piu' grandi; piu' rank significa
# memoria piu' vicina (ogni processo tocca la propria) e nessun costo di team.
#
# --map-by socket:PE=5 e' la parte che non si puo' sbagliare: assegna a ogni
# rank cinque core dedicati, invece di confinarlo su uno solo come farebbe
# --bind-to core. Senza, i cinque thread di ogni rank si contenderebbero un
# core e il confronto misurerebbe l'oversubscription.
name=c7_omp_hybrid_2x2
experiment=k-sweep
outdir=results/c7_openmp

kernel=omp_scheme_a
omp_threads=5
omp_proc_bind=spread
omp_places=cores

M=20000
N=20000
ks=3 32

reps=20
warmup=5
seed=20252026

np=4
pr=2
pc=2

bind_to=
map_by=socket:PE=5

a_mode=local
x_mode=local
prec=double

continue_on_error=1

# C7.1 - precisione x k: cuda_warp_smem, double.
# La coppia FP64/FP32 mantiene problema, backend e parametri di build uguali.
# Per il solo calcolo GPU usare t_kernel_mean_s; t_total_mean_s include le copie.
name=c7_1_cuda_warp_smem_double
experiment=k-sweep
outdir=results/c7_1_precision_k

kernel=cuda_warp_smem
prec=double
M=10000
N=10000
ks=3 6 8 20 32
block=256
smem_pad=1

reps=20
warmup=5
seed=20252026
np=1
pr=1
pc=1
bind_to=core
map_by=core
a_mode=local
x_mode=local
force_generic_k=0
test_a_padding=0
nvcc_arch=sm_75
continue_on_error=0

# C5 - weak scaling                    P = 4, griglia 2x2
#
# Blocco locale costante: m_loc = 10000/2 = 5000, n_loc = 10000/2 = 5000.
# Il lavoro per rank, 2*m_loc*n_loc*k, non cambia da P=1 a P=20; il lavoro
# globale cresce come P. Il tempo ideale e' quindi PIATTO, e la pendenza che
# si misura e' il costo della comunicazione.
#
# Nota da riportare in relazione: su una griglia 2D il weak scaling cambia
# anche il RAPPORTO M:N (qui 10000:10000), perche' M segue pr e N segue pc.
# E' inerente alla decomposizione, non un difetto della campagna, ed e' il
# motivo per cui C1 misura l'effetto della forma separatamente.
name=c5_weak_P4
experiment=k-sweep
outdir=results/c5_weak_scaling

kernel=scheme_a
M=10000
N=10000
ks=3 32

reps=20
warmup=5
seed=20252026

np=4
pr=2
pc=2

bind_to=core
map_by=core

a_mode=local
x_mode=local
prec=double

continue_on_error=1

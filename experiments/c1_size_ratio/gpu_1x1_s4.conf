# C1 - sweep dimensioni x rapporto M:N     rapporto 1:1, taglia s4
#
# Campagna richiesta esplicitamente dalla traccia: "le misure di performance
# dovranno essere ripetute per dimensioni M ed N che vengano fatte crescere;
# si consiglia un set di almeno 3 rapporti tra M ed N ... l'insieme dovra'
# comunque contenere almeno il caso M = N".
#
# I quattro passi s1..s4 crescono di un fattore 4 in M*N, e i tre rapporti
# hanno M*N uguale entro il 5% a parita' di passo: sovrapponendo le curve
# sullo stesso asse si legge l'effetto della FORMA del blocco locale a
# parita' di lavoro. Qui M*N = 6.55e+08.
#
# Perche' conta: il rapporto M:N decide la forma del blocco locale, quindi
# quanto pesa il Bcast di X (~ n_loc*k) contro la Reduce di Y (~ m_loc*k),
# e su GPU quanti warp esistono (m_loc) contro quanto e' lungo il ciclo
# interno (n_loc). Una matrice larga e bassa affama la GPU di parallelismo.
name=c1_gpu_1x1_s4
experiment=k-sweep
outdir=results/c1_size_ratio_gpu

kernel=cuda_warp
M=25600
N=25600

# Un k piccolo e uno grande: bastano a separare il regime limitato dalla
# banda (k=8) da quello limitato dal calcolo (k=32) lungo tutta la curva.
ks=8 32
block=256

# reps piu' basso del solito: C1 e' 24 punti per backend. La colonna
# t_official_cv_pct dice riga per riga se la media e' stabile.
reps=10
warmup=3
seed=20252026

np=1
pr=1
pc=1

a_mode=local
x_mode=local
prec=double

continue_on_error=1

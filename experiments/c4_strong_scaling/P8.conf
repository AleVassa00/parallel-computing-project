# C4 - strong scaling                  P = 8, griglia 2x4
#
# Il problema globale NON cambia al variare di P: e' 20000 x 20000, cioe' A da
# 3.2 GB in double, che a P=20 lascia 160 MB per rank - abbastanza da non
# entrare in cache e da misurare il kernel, non la L3.
#
# k = 3 e k = 32 sono i due estremi della traccia e servono insieme perche'
# il volume di comunicazione e' proporzionale a k mentre il calcolo e'
# proporzionale a k: cambiando k si sposta il punto in cui la comunicazione
# smette di essere trascurabile. Con k=3 la scalabilita' e' quasi ideale,
# con k=32 il Bcast/Reduce pesa dieci volte tanto, ed e' li' che si rompe.
#
# experiment=k-sweep con una griglia FISSA degenera in "esegui questi k su
# questa griglia": e' esattamente un punto di strong scaling. Le colonne da
# leggere per il grafico sono t_bcast_mean_s, t_local_mean_s, t_reduce_mean_s
# e gflops.
name=c4_strong_P8
experiment=k-sweep
outdir=results/c4_strong_scaling

kernel=scheme_a
M=20000
N=20000
ks=3 32

reps=20
warmup=5
seed=20252026

np=8
pr=2
pc=4

# Sul server il binding e' obbligatorio: senza, le misure sono rumore.
bind_to=core
map_by=core

a_mode=local
x_mode=local
prec=double

continue_on_error=1
